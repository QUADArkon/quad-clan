<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>[QUAD] TV</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}#mainwindow{display:block;width:100%;height:100%;outline:0;border:0}#loading,#end1,#end2{display:none}#progress{position:absolute;left:8px;bottom:8px;color:#fff;font:12px monospace}#quadtvLogo{position:absolute;right:12px;bottom:12px;width:85px;height:128px;object-fit:contain;opacity:.48;pointer-events:none;user-select:none;z-index:20}</style></head><body><canvas id="mainwindow" tabindex="0"></canvas><img id="loading" alt=""><div id="progress"></div><div id="end1"></div><div id="end2"></div><img id="quadtvLogo" src="quadtv.png" width="85" height="128" alt=""><script>
(function(){
  'use strict';
  window.QUAD_DEMO_PLAYER=true;
  const params=new URLSearchParams(location.search);
  const demo=params.get('demo');
  if(!demo||!/^\.\.\/demos\/[A-Za-z0-9._/-]+\.dem$/i.test(demo)||demo.includes('..','../'.length)){
    document.getElementById('progress').textContent='Invalid or missing demo path.';
    return;
  }
  /* quadtv.js already consumes Quake-style location.search. Replace ?demo= with the exact command line before it loads. */
  history.replaceState(null,'',location.pathname+'?+playdemo%20'+encodeURIComponent(demo).replace(/%2F/gi,'/'));
})();
</script><script src="quadtv.js?v=0.42-wateralpha4"></script></body></html>
