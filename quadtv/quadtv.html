async function demoSize(){const name=demo.split('/').pop().toLowerCase();if(DEMO_BYTES[name])return DEMO_BYTES[name];const r=await fetch(demo,{method:'HEAD',cache:'no-cache'});if(!r.ok)throw new Error('DEMO NOT FOUND');const n=Number(r.headers.get('Content-Length'));if(!Number.isFinite(n)||n<=0)throw new Error('DEMO SIZE UNKNOWN');return n}
async function preloadOne(asset,state){quakeText(preloadStage,'LOADING '+asset.label);const r=await fetch(asset.url,{cache:'force-cache'});if(!r.ok)throw new Error('LOAD FAILED '+asset.label);if(!r.body){await r.arrayBuffer();state.loaded+=asset.size;updatePreload(state);return}const reader=r.body.getReader();let counted=0;for(;;){const part=await reader.read();if(part.done)break;counted+=part.value.byteLength;state.loaded+=part.value.byteLength;updatePreload(state)}if(counted<asset.size){state.loaded+=asset.size-counted;updatePreload(state)}}
function updatePreload(state){const pct=Math.max(0,Math.min(100,state.total?state.loaded/state.total*100:0));preloadFill.style.width=pct.toFixed(1)+'%';quakeText(preloadProgress,Math.floor(pct)+' PERCENT');quakeText(preloadBytes,formatBytes(Math.min(state.loaded,state.total))+' / '+formatBytes(state.total))}

leSlider('gamma');q('mWater').onclick=()=>openMobileSlider('water');q('mClose').onclick=()=>{closeMobileSlider();scheduleMobileBarHide()};mSlider.oninput=()=>{if(mobileParam==='view')view(chase?'distance':'fov',mSlider.value);else if(mobileParam==='gamma')gamma(mSlider.value);else if(mobileParam==='water')water(mSlider.value)};q('mExit').onclick=askExit;quakeMessage.onclick=()=>{if(messageMode==='finished')closeQUADTV('QUADTV_FINISHED');else cancelExit()};window.addEventListener('keydown',e=>{if(quakeMessage.hidden)return;if(messageMode==='finished'){e.preventDefault();closeQUADTV('QUADTV_FINISHED');return}if(e.key==='y'||e.key==='Y'||e.key==='Enter'){e.preventDefault();closeQUADTV('QUADTV_EXIT')}else if(e.key==='n'||e.key==='N'||e.key==='Escape'){e.preventDefault();cancelExit()}});window.addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.data&&e.data.type==='QUADTV_FINISHED')demoFinished()})})();
