<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>[QUAD] LAN Parties</title>
<link rel="stylesheet" href="../../css/quad.css">
<style>
.lans-wrap{opacity:1;transition:opacity .5s ease}.lans-wrap.is-fading{opacity:0}.lans{width:100%;padding:8px 10px}.lans-header{display:block;max-width:100%;height:auto;margin:0 auto 8px}.lans-title{text-align:center;font-weight:bold;margin:2px 0 14px}.albums-grid{display:grid;grid-template-columns:repeat(3,160px);justify-content:center;gap:18px}.album,.photo{text-align:center}.album a,.photo a{display:block}.album-thumb,.photo-thumb{display:block;width:128px;height:96px;object-fit:contain;margin:0 auto 5px;border:0}.album-title,.album-date,.album-place,.photo-date{display:block;line-height:1.25}.album-title{font-weight:bold}.album-head{text-align:center;margin:2px 0 14px}.album-head strong,.album-head span{display:block}.photos-grid{display:grid;grid-template-columns:repeat(4,128px);justify-content:center;gap:14px 12px}.photos-last-row{grid-column:1/-1;display:flex;justify-content:center;gap:12px}.album-back,.viewer-back{display:inline-block;margin:14px 0 2px}.viewer{display:none;text-align:center}.viewer.is-visible{display:block}.viewer-image{display:block;max-width:100%;height:auto;margin:0 auto;border:0;cursor:pointer}.viewer-bottom{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin:10px 0 12px}.viewer-bottom>a:first-child{text-align:left}.viewer-bottom>a:last-child{text-align:right}.viewer-center{text-align:center}.viewer-center span{display:block;line-height:1.3}.viewer-album{font-weight:bold}.viewer-position{margin-top:2px}@media(max-width:600px){.albums-grid{grid-template-columns:repeat(2,140px);gap:16px 8px}.photos-grid{grid-template-columns:repeat(2,128px)}.photos-last-row{display:contents}.viewer-bottom{grid-template-columns:auto 1fr auto;gap:8px}.viewer-bottom a{white-space:nowrap}}@media(prefers-reduced-motion:reduce){.lans-wrap{transition:none}}
</style>
</head>
<body class="content-page">
<div class="quad-content lans-wrap">
<div class="content-box lans">
<div id="indexView">
<img class="lans-header" src="../../images/pages/lans/header.gif" alt="LAN Parties">
<div class="lans-title">LAN PARTIES</div>
<div id="albumsGrid" class="albums-grid"></div>
</div>
<div id="albumView" style="display:none"><div class="album-head"><strong id="albumTitle"></strong><span id="albumDate"></span><span id="albumPlace"></span></div><div id="photosGrid" class="photos-grid"></div><div style="text-align:center"><a id="albumBack" class="album-back" href="#">BACK TO ALBUMS</a></div></div>
<div id="viewerView" class="viewer"><img id="viewerImage" class="viewer-image" src="" alt=""><div class="viewer-bottom"><a id="viewerPrevious" href="#">&laquo; PREVIOUS</a><div class="viewer-center"><span id="viewerAlbum" class="viewer-album"></span><span id="viewerDescription"></span><span id="viewerPosition" class="viewer-position"></span></div><a id="viewerNext" href="#">NEXT &raquo;</a></div><a id="viewerBack" class="viewer-back" href="#">BACK TO ALBUM</a></div>
</div>
</div>
<script src="../../js/lans.js"></script>
<script>
(function(){var FADE_MS=500,currentAlbum=null,currentIndex=0,changing=false,savedScroll=0;var albumCovers={quit:'004',lan1:'005',lan2:'002',lan3:'005',lan4:'002',lan5:'012',lan6:'005',lan7:'009',quads:'20151228'};var wrap=document.querySelector('.lans-wrap'),indexView=document.getElementById('indexView'),albumView=document.getElementById('albumView'),viewerView=document.getElementById('viewerView'),albumsGrid=document.getElementById('albumsGrid'),photosGrid=document.getElementById('photosGrid');function fmtDate(v){if(!v||v.length!==8)return v||'';return v.slice(4,6)+'/'+v.slice(6,8)+'/'+v.slice(0,4)}function eventDate(a){return a.dateEnd?fmtDate(a.date)+' - '+fmtDate(a.dateEnd):fmtDate(a.date)}function imagePath(x){return typeof x==='string'?x:x.path}function imageDate(x,a){return typeof x==='string'?eventDate(a):fmtDate(x.date)}function baseName(x){var f=imagePath(x).replace(/\\/g,'/').split('/').pop();return f.replace(/\.[^.]+$/,'')}function albumCover(a){var wanted=albumCovers[a.id];if(wanted){for(var i=0;i<a.images.length;i++){if(baseName(a.images[i])===wanted)return imagePath(a.images[i])}}return a.images.length?imagePath(a.images[0]):''}function fade(action,scroll){if(changing)return;changing=true;wrap.classList.add('is-fading');setTimeout(function(){action();window.scrollTo(0,scroll||0);requestAnimationFrame(function(){requestAnimationFrame(function(){wrap.classList.remove('is-fading');setTimeout(function(){changing=false},FADE_MS)})})},FADE_MS)}function renderAlbums(){albumsGrid.innerHTML='';lanAlbums.forEach(function(a,i){var d=document.createElement('div'),link=document.createElement('a'),img=document.createElement('img'),title=document.createElement('span'),date=document.createElement('span'),place=document.createElement('span');d.className='album';link.href='#';link.dataset.index=i;link.onclick=function(e){e.preventDefault();openAlbum(+this.dataset.index)};img.className='album-thumb';img.src=albumCover(a);img.alt=a.title;img.loading='lazy';title.className='album-title';title.textContent=a.title;date.className='album-date';date.textContent=a.id==='quads'?'':eventDate(a);place.className='album-place';place.textContent=a.place||'';link.append(img,title,date,place);d.appendChild(link);albumsGrid.appendChild(d)})}function makePhoto(x,i){var d=document.createElement('div'),a=document.createElement('a'),img=document.createElement('img'),date=document.createElement('span');d.className='photo';a.href='#';a.dataset.index=i;a.onclick=function(e){e.preventDefault();openViewer(+this.dataset.index)};img.className='photo-thumb';img.src=imagePath(x);img.alt=currentAlbum.title;img.loading='lazy';a.appendChild(img);d.appendChild(a);if(currentAlbum.id==='quads'){date.className='photo-date';date.textContent=imageDate(x,currentAlbum);d.appendChild(date)}return d}function renderAlbum(){document.getElementById('albumTitle').textContent=currentAlbum.title;document.getElementById('albumDate').textContent=currentAlbum.id==='quads'?'':eventDate(currentAlbum);document.getElementById('albumPlace').textContent=currentAlbum.place||'';photosGrid.innerHTML='';var n=currentAlbum.images.length,full=n-n%4;for(var i=0;i<full;i++)photosGrid.appendChild(makePhoto(currentAlbum.images[i],i));if(full<n){var row=document.createElement('div');row.className='photos-last-row';for(var j=full;j<n;j++)row.appendChild(makePhoto(currentAlbum.images[j],j));photosGrid.appendChild(row)}}function openAlbum(i){fade(function(){currentAlbum=lanAlbums[i];indexView.style.display='none';viewerView.classList.remove('is-visible');albumView.style.display='block';renderAlbum()},0)}function renderViewer(){var x=currentAlbum.images[currentIndex];var viewerImage=document.getElementById('viewerImage'),viewerAlbum=document.getElementById('viewerAlbum'),viewerDescription=document.getElementById('viewerDescription'),viewerPosition=document.getElementById('viewerPosition'),viewerPrevious=document.getElementById('viewerPrevious'),viewerNext=document.getElementById('viewerNext');viewerImage.src=imagePath(x);viewerImage.alt=currentAlbum.title;viewerAlbum.textContent=currentAlbum.title;var b=[];if(currentAlbum.place)b.push(currentAlbum.place);b.push(imageDate(x,currentAlbum));viewerDescription.textContent=b.join(' - ');viewerPosition.textContent=(currentIndex+1)+' / '+currentAlbum.images.length;viewerPrevious.style.visibility=currentIndex===0?'hidden':'visible';viewerNext.style.visibility=currentIndex===currentAlbum.images.length-1?'hidden':'visible'}function openViewer(i){savedScroll=window.pageYOffset||document.documentElement.scrollTop||0;currentIndex=i;fade(function(){albumView.style.display='none';viewerView.classList.add('is-visible');renderViewer()},0)}function move(step){var n=currentIndex+step;if(n<0||n>=currentAlbum.images.length||changing)return;fade(function(){currentIndex=n;renderViewer()},0)}function closeViewer(){fade(function(){viewerView.classList.remove('is-visible');albumView.style.display='block';renderAlbum()},savedScroll)}document.getElementById('albumBack').onclick=function(e){e.preventDefault();fade(function(){albumView.style.display='none';indexView.style.display='block'},0)};document.getElementById('viewerPrevious').onclick=function(e){e.preventDefault();move(-1)};document.getElementById('viewerNext').onclick=function(e){e.preventDefault();move(1)};document.getElementById('viewerBack').onclick=function(e){e.preventDefault();closeViewer()};document.getElementById('viewerImage').onclick=function(){if(currentIndex<currentAlbum.images.length-1)move(1)};document.addEventListener('keydown',function(e){if(!viewerView.classList.contains('is-visible'))return;if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(e.key==='Escape')closeViewer()});renderAlbums()})();
</script>
</body>
</html>
