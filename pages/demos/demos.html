<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>[QUAD] Demos</title>
<link rel="stylesheet" href="../../css/quad.css">
<style>
html,body{width:100%;min-height:100%;margin:0}
/* Fixed viewport layer: opening cards never changes the iframe/document scroll state or horizontal geometry. */
.demos-viewport{position:static;overflow:visible}

.demos-page{width:600px;max-width:calc(100% - 16px);margin:8px auto;box-sizing:border-box}
.demos-head{text-align:center}
.demos-nav,.demos-filters,.stats-nav,.demo-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.demos-nav{margin:12px 0 18px}.demos-filters,.stats-nav{margin-bottom:12px}
.demo-button{padding:7px 11px;border:1px solid #777;background:#000;color:#ddd;font:inherit;cursor:pointer;text-decoration:none}
.demo-button.active,.demo-button:hover{border-color:#d4aa60;color:#fff;background:#302518}
.demo-panel[hidden]{display:none}.demo-list{display:grid;gap:10px}
.demo-card{padding:10px;border:1px solid #777;border-radius:12px;overflow:hidden;box-sizing:border-box}
.demo-card-head{display:flex;justify-content:space-between;gap:10px;color:#e7c786;cursor:pointer;user-select:none}
.demo-card-head:focus-visible{outline:1px solid #d4aa60;outline-offset:3px}
.demo-card-body{height:0;overflow:hidden;transition:height .5s ease}
.demo-match{margin-top:9px;padding:9px;border-left:3px solid #8a6b38}
.demo-match-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(180px,32%);gap:12px;align-items:center}
.demo-details{min-width:0}.demo-match-section+.demo-match-section{margin-top:12px;padding-top:10px;border-top:1px solid #555}
.demo-map-box{border:1px solid #777;border-radius:10px;background:#000;padding:6px;display:flex;align-items:center;justify-content:center;overflow:hidden;align-self:center}
.demo-map-image{display:block;max-width:100%;width:auto;height:auto;max-height:260px;object-fit:contain;border-radius:7px}
.demo-line{margin:4px 0;overflow-wrap:anywhere}.demo-actions{margin-top:9px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px}
.stat-card{padding:12px;border:1px solid #777}.stat-card strong{display:block;font-size:22px;color:#e7c786}
.stats-table-wrap{overflow:auto}.stats-table{width:100%;border-collapse:collapse}
.stats-table th,.stats-table td{padding:7px;border-bottom:1px solid #444;text-align:left}.stats-table th{color:#e7c786}
.bot-player{color:#d4aa60}.demo-note{font-size:12px;color:#aaa}.demo-error{padding:14px;border:1px solid #984c45;color:#ffbdb5;background:#180a09}
@media(max-width:767px){.demo-match-layout{grid-template-columns:1fr}.demo-card-head{display:block}.stats-table{font-size:11px}.stats-table th,.stats-table td{padding:5px 3px}}
.multi-match-separator{margin:10px 0 12px;border-top:1px solid #555}#statsContent.stats-center-table .stats-table th,#statsContent.stats-center-table .stats-table td{text-align:center}</style>
</head>
<body class="content-page">
<div class="demos-viewport">
<main class="quad-content demos-page"><div class="content-box" style="padding:10px">
<div class="demos-head"><p><img src="../../images/pages/demos/header.png" alt="" width="64" height="64"></p><p><strong>DEMOS</strong></p></div>
<nav class="demos-nav"><button class="demo-button active" type="button" data-view="archive">ARCHIVE</button><button class="demo-button" type="button" data-view="stats">DEMOSTATS</button></nav>
<section id="archivePanel" class="demo-panel"><div class="demos-filters"><button class="demo-button active" type="button" data-mode="all">ALL</button><button class="demo-button" type="button" data-mode="duel">DUEL</button><button class="demo-button" type="button" data-mode="ffa">FFA</button><button class="demo-button" type="button" data-mode="teamplay">TEAMPLAY</button><button class="demo-button" type="button" data-mode="bots">VS BOTS</button></div><div id="demoList" class="demo-list"></div></section>
<section id="statsPanel" class="demo-panel" hidden><div class="stats-nav"><button class="demo-button active" type="button" data-stat="overview">OVERVIEW</button><button class="demo-button" type="button" data-stat="duels">DUEL</button><button class="demo-button" type="button" data-stat="ffa">FFA</button><button class="demo-button" type="button" data-stat="clanwars">TEAMPLAY</button><button class="demo-button" type="button" data-stat="bots">VS BOTS</button></div><div class="stats-nav"><button class="demo-button" type="button" data-stat="players">PLAYERS</button><button class="demo-button" type="button" data-stat="maps">MAPS</button><button class="demo-button" type="button" data-stat="history">HISTORY</button><button class="demo-button" type="button" data-stat="records">RECORDS</button></div><div id="statsContent"></div></section>
</div></main>
</div>
<script>
document.write('<script src="../../js/demos-data.js?_=' + Date.now() + '"><\/script>');
</script>
<script>
(function(){'use strict';
var ROOT='../../',QUADTV=ROOT+'quadtv/quadtv.html',list=document.getElementById('demoList'),statsContent=document.getElementById('statsContent');
if(!Array.isArray(window.QUAD_DEMOS)){list.innerHTML='<div class="demo-error">Unable to load demos-data.js.</div>';return}var demos=window.QUAD_DEMOS;
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function known(v){return Number.isFinite(v)}function score(v){return known(v)?v:'?'}function canonical(v){return String(v||'').trim().toLowerCase()}function sitePath(f){return ROOT+String(f).replace(/^\/+/, '')}

function people(m){return m.mode==='clanwar'?(m.teams||[]).flatMap(function(t){return(t.players||[]).map(function(p){return Object.assign({team:t.name},p)})}):(m.players||[])}
function teamScore(t){return(t.players||[]).reduce(function(n,p){return n+(known(p.frags)?p.frags:0)},0)}

function results(m){if(m.mode==='clanwar')return(m.teams||[]).map(function(t){return esc(t.name)+' '+teamScore(t)}).join(' - ');return(m.players||[]).map(function(p){return esc(p.name)+' '+score(p.frags)}).join(' - ')}
function demoHTML(d){var rows=demoMatches(d),img='../../images/pages/demos/'+encodeURIComponent(String(d.map).toLowerCase())+'.jpg';var common=line('Number of Matches',rows.length)+(d.event?line('Event',esc(d.event)):'')+line('Type',esc(d.mode==='clanwar'?'Teamplay':d.mode==='ffa'?'FFA':d.mode==='bots'?'Vs Bots':d.mode.charAt(0).toUpperCase()+d.mode.slice(1)))+(d.mode==='bots'?line('Bot Model',esc(d.botModel))+line('Bot Skill',esc(d.botSkill)):'')+(d.mode==='clanwar'&&d.teams&&d.teams.length>=2?line('Format',(d.teams[0].players||[]).length+' vs '+(d.teams[1].players||[]).length):'')+line('Map',esc(String(d.map).toUpperCase()))+line('POV',esc(d.pov));var blocks=rows.map(function(m,i){return'<div class="demo-match-section">'+(rows.length>1?'<div class="demo-line"><strong>Match '+(i+1)+'</strong></div>':'')+line('Timelimit',esc(m.timelimit))+line('Fraglimit',esc(m.fraglimit))+line('Deathmatch Mode',esc(m.deathmatch))+line('Powerups',esc(m.powerups))+line('Results',results(m))+'</div>'}).join('');return'<div class="demo-match"><div class="demo-match-layout"><div class="demo-details">'+common+(rows.length>1?'<div class="multi-match-separator"></div>':'')+blocks+'</div><div class="demo-map-box content-box"><img class="demo-map-image" src="'+img+'" alt="'+esc(String(d.map).toUpperCase())+'"></div></div></div>'}
function playDemo(file,map){var path='/'+String(file).replace(/^\/+/, ''),url=QUADTV+'?demo='+encodeURIComponent(path)+'&map='+encodeURIComponent(map)+'&embedded=1';try{var doc=window.top.document,old=doc.getElementById('quadtv-overlay');if(old)old.remove();var overlay=doc.createElement('div');overlay.id='quadtv-overlay';overlay.style.cssText='position:fixed;inset:0;z-index:2147483647;background:#000;width:100vw;height:100vh;overflow:hidden';var frame=doc.createElement('iframe');frame.allow='autoplay; fullscreen';frame.style.cssText='width:100%;height:100%;border:0';frame.src=url;overlay.appendChild(frame);doc.body.appendChild(overlay)}catch(e){window.location.href=url}}
function bindAccordion(){document.querySelectorAll('.demo-card').forEach(function(card){var head=card.querySelector('.demo-card-head'),body=card.querySelector('.demo-card-body');body.style.height='0px';function toggle(){if(card.dataset.animating==='1')return;card.dataset.animating='1';var opening=body.style.height==='0px';body.style.overflow='hidden';if(opening){body.style.height='0px';requestAnimationFrame(function(){requestAnimationFrame(function(){body.style.height=body.scrollHeight+'px'})})}else{body.style.height=body.scrollHeight+'px';requestAnimationFrame(function(){body.style.height='0px'})}}head.onclick=toggle;head.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}};body.addEventListener('transitionend',function(e){if(e.propertyName!=='height')return;if(body.style.height!=='0px'){body.style.height='auto';body.style.overflow=''}card.dataset.animating='0'})})}
function renderArchive(mode){mode=mode||'all';document.querySelectorAll('[data-mode]').forEach(function(b){b.classList.toggle('active',b.dataset.mode===mode)});var wanted=mode==='teamplay'?'clanwar':mode;var filtered=demos.filter(function(d){return mode==='all'||d.mode===wanted}).slice().sort(function(a,b){return String(b.date||'').localeCompare(String(a.date||''))});list.innerHTML=filtered.map(function(d){return'<article class="demo-card"><div class="demo-card-head" role="button" tabindex="0"><b>'+esc(matchTitle(d))+'</b><span>'+longDate(d.date)+'</span></div><div class="demo-card-body">'+demoHTML(d)+'<div class="demo-actions"><button class="demo-button" type="button" data-play="'+esc(d.file)+'" data-map="'+esc(d.map)+'">PLAY</button><a class="demo-button" href="'+esc(sitePath(d.file))+'" download>DOWNLOAD</a></div></div></article>'}).join('')||'<p>No demos in this category.</p>';bindAccordion();document.querySelectorAll('[data-play]').forEach(function(b){b.onclick=function(e){e.stopPropagation();playDemo(b.dataset.play,b.dataset.map)}})}
function card(v,l){return'<div class="stat-card"><strong>'+v+'</strong>'+l+'</div>'}function table(h,r){return'<div class="stats-table-wrap"><table class="stats-table"><thead><tr>'+h.map(function(x){return'<th>'+x+'</th>'}).join('')+'</tr></thead><tbody>'+r.join('')+'</tbody></table></div>'}
function overview(){var ms=allMatches(),ps=new Set(),maps=new Set(),povs=new Set(),min=0,fr=0;ms.forEach(function(m){maps.add(canonical(m.map));if(m.pov)povs.add(canonical(m.pov));if(known(m.timelimit))min+=m.timelimit;people(m).forEach(function(p){ps.add(canonical(p.name));if(known(p.frags))fr+=p.frags})});function count(mode){return ms.filter(function(m){return m.mode===mode}).length}return'<div class="stats-grid">'+card(demos.length,'DEMOS')+card(ms.length,'MATCHES')+card(min,'MINUTES')+card(fr,'FRAGS')+card(min?(fr/min).toFixed(2):'?','FRAGS/MIN')+card(povs.size,'POVS')+card(ps.size,'PLAYERS')+card(maps.size,'MAPS')+card(count('duel'),'DUEL')+card(count('ffa'),'FFA')+card(count('clanwar'),'TEAMPLAY')+card(count('bots'),'VS BOTS')+'</div>'}
function playersStats(){var o={};allMatches().forEach(function(m){people(m).forEach(function(p){var k=canonical(p.name),x=o[k]||(o[k]={name:p.name,matches:0,minutes:0,frags:0,scores:0,pov:0,bot:false});x.matches++;if(known(m.timelimit))x.minutes+=m.timelimit;if(known(p.frags)){x.frags+=p.frags;x.scores++}if(canonical(m.pov)===k)x.pov++;if(p.bot)x.bot=true})});var rows=Object.values(o).sort(function(a,b){return b.frags-a.frags}).map(function(x){return'<tr><td'+(x.bot?' class="bot-player"':'')+'>'+esc(x.name)+(x.bot?' *':'')+'</td><td>'+x.matches+'</td><td>'+x.minutes+'</td><td>'+x.frags+'</td><td>'+(x.minutes?(x.frags/x.minutes).toFixed(2):'?')+'</td><td>'+(x.scores?(x.frags/x.scores).toFixed(1):'?')+'</td><td>'+x.pov+'</td></tr>'});return table(['PLAYER','MATCHES','MINUTES','FRAGS','FPM','AVG','POV'],rows)+'<p class="demo-note"><span class="bot-player">*</span> Bot player</p>'}
function mapsStats(){var o={};allMatches().forEach(function(m){var k=canonical(m.map),x=o[k]||(o[k]={matches:0,minutes:0,frags:0});x.matches++;if(known(m.timelimit))x.minutes+=m.timelimit;people(m).forEach(function(p){if(known(p.frags))x.frags+=p.frags})});return table(['MAP','MATCHES','MINUTES','FRAGS','FPM'],Object.entries(o).sort(function(a,b){return b[1].matches-a[1].matches}).map(function(e){var x=e[1];return'<tr><td>'+esc(e[0].toUpperCase())+'</td><td>'+x.matches+'</td><td>'+x.minutes+'</td><td>'+x.frags+'</td><td>'+(x.minutes?(x.frags/x.minutes).toFixed(2):'?')+'</td></tr>'}))}
function modeStats(mode){var ds=demos.filter(function(d){return d.mode===mode}),ms=allMatches().filter(function(m){return m.mode===mode}),ps=new Set(),maps=new Set(),povs=new Set(),min=0,fr=0;ms.forEach(function(m){maps.add(canonical(m.map));if(m.pov)povs.add(canonical(m.pov));if(known(m.timelimit))min+=m.timelimit;people(m).forEach(function(p){ps.add(canonical(p.name));if(known(p.frags))fr+=p.frags})});return'<div class="stats-grid">'+card(ds.length,'DEMOS')+card(ms.length,'MATCHES')+card(min,'MINUTES')+card(fr,'FRAGS')+card(min?(fr/min).toFixed(2):'?','FRAGS/MIN')+card(povs.size,'POVS')+card(ps.size,'PLAYERS')+card(maps.size,'MAPS')+'</div>'}
function history(){var y={};allMatches().forEach(function(m){var k=String(m.date).slice(0,4),x=y[k]||(y[k]={all:0,clanwar:0,duel:0,ffa:0,bots:0,minutes:0,frags:0});x.all++;x[m.mode]=(x[m.mode]||0)+1;if(known(m.timelimit))x.minutes+=m.timelimit;people(m).forEach(function(p){if(known(p.frags))x.frags+=p.frags})});return table(['YEAR','MATCHES','MINUTES','FRAGS','FPM','DUEL','FFA','TEAM','VS BOTS'],Object.entries(y).sort(function(a,b){return b[0].localeCompare(a[0])}).map(function(e){var x=e[1];return'<tr><td>'+e[0]+'</td><td>'+x.all+'</td><td>'+x.minutes+'</td><td>'+x.frags+'</td><td>'+(x.minutes?(x.frags/x.minutes).toFixed(2):'?')+'</td><td>'+x.duel+'</td><td>'+x.ffa+'</td><td>'+x.clanwar+'</td><td>'+x.bots+'</td></tr>'}))}
function records(){
  var matches=allMatches(),duelPlayers={},duelPairs={},duelMaps={},duelGames=[],ffaPlayers={},ffaMaps={},ffaGames=[],teams={},teamMatchups={},teamMaps={},teamFormats={},teamGames=[],teamIndividuals=[],botPlayers={},botMaps={},botGames=[];
  function pairKey(a,b){return [a,b].sort().join(' vs ');}
  function maxEntry(obj,get){var entries=Object.entries(obj);return entries.length?entries.sort(function(a,b){return get(b[1])-get(a[1]);})[0]:null;}
  function row(label,value){return '<tr><td>'+esc(label)+'</td><td>'+value+'</td></tr>';}
  function section(title,rows){return rows.length?'<h3>'+title+'</h3>'+table(['RECORD','HOLDER / VALUE'],rows):'';}
  matches.forEach(function(m){
    if(m.mode==='duel'&&m.players&&m.players.length===2&&m.players.every(function(p){return !p.bot&&known(p.frags);})){var a=m.players[0],b=m.players[1],pa=duelPlayers[a.name]||(duelPlayers[a.name]={wins:0}),pb=duelPlayers[b.name]||(duelPlayers[b.name]={wins:0});if(a.frags>b.frags)pa.wins++;else if(b.frags>a.frags)pb.wins++;duelPairs[pairKey(a.name,b.name)]=(duelPairs[pairKey(a.name,b.name)]||0)+1;duelMaps[m.map]=(duelMaps[m.map]||0)+1;duelGames.push({a:a,b:b,margin:Math.abs(a.frags-b.frags)});}
    if(m.mode==='ffa'&&m.players&&m.players.length){var ranked=m.players.filter(function(p){return known(p.frags);}).slice().sort(function(a,b){return b.frags-a.frags;});if(ranked.length){if(ranked.length===1||ranked[0].frags>ranked[1].frags){var fp=ffaPlayers[ranked[0].name]||(ffaPlayers[ranked[0].name]={wins:0});fp.wins++;}var total=ranked.reduce(function(n,p){return n+p.frags;},0),fpm=known(m.timelimit)&&m.timelimit>0?total/m.timelimit:null;ffaMaps[m.map]=(ffaMaps[m.map]||0)+1;ffaGames.push({winner:ranked[0],map:m.map,date:m.date,players:m.players.length,fpm:fpm});}}
    if(m.mode==='clanwar'&&m.teams&&m.teams.length===2){var ta=m.teams[0],tb=m.teams[1],sa=teamScore(ta),sb=teamScore(tb),xa=teams[ta.name]||(teams[ta.name]={wins:0}),xb=teams[tb.name]||(teams[tb.name]={wins:0});if(sa>sb)xa.wins++;else if(sb>sa)xb.wins++;teamMatchups[pairKey(ta.name,tb.name)]=(teamMatchups[pairKey(ta.name,tb.name)]||0)+1;teamMaps[m.map]=(teamMaps[m.map]||0)+1;var format=(ta.players||[]).length+' vs '+(tb.players||[]).length;teamFormats[format]=(teamFormats[format]||0)+1;teamGames.push({a:ta,b:tb,sa:sa,sb:sb,margin:Math.abs(sa-sb)});people(m).forEach(function(p){if(known(p.frags))teamIndividuals.push({name:p.name,frags:p.frags,map:m.map});});}
    if(m.mode==='bots'&&m.players&&m.players.length===2){var hp=m.players.find(function(p){return !p.bot;}),bp=m.players.find(function(p){return p.bot;});if(hp&&bp&&known(hp.frags)&&known(bp.frags)){var bx=botPlayers[hp.name]||(botPlayers[hp.name]={wins:0});if(hp.frags>bp.frags)bx.wins++;botMaps[m.map]=(botMaps[m.map]||0)+1;botGames.push({human:hp,bot:bp,margin:hp.frags-bp.frags});}}
  });
  var duelRows=[],ffaRows=[],teamRows=[],botRows=[],r;
  r=maxEntry(duelPlayers,function(x){return x.wins;});if(r)duelRows.push(row('Most Duel Wins',esc(r[0])+' · '+r[1].wins));var dv=duelGames.filter(function(g){return g.margin>0;}).sort(function(a,b){return b.margin-a.margin;})[0];if(dv){var dw=dv.a.frags>dv.b.frags?dv.a:dv.b;duelRows.push(row('Largest Duel Victory',esc(dw.name)+' · +'+dv.margin));}var ds=duelGames.flatMap(function(g){return[g.a,g.b];}).sort(function(a,b){return b.frags-a.frags;});if(ds[0])duelRows.push(row('Highest Duel Score',esc(ds[0].name)+' · '+ds[0].frags));r=maxEntry(duelPairs,function(x){return x;});if(r)duelRows.push(row('Most Played Duel Pair',esc(r[0])+' · '+r[1]));r=maxEntry(duelMaps,function(x){return x;});if(r)duelRows.push(row('Most Played Duel Map',esc(String(r[0]).toUpperCase())+' · '+r[1]));
  r=maxEntry(ffaPlayers,function(x){return x.wins;});if(r)ffaRows.push(row('Most FFA Wins',esc(r[0])+' · '+r[1].wins));var fs=ffaGames.slice().sort(function(a,b){return b.winner.frags-a.winner.frags;})[0];if(fs)ffaRows.push(row('Highest FFA Score',esc(fs.winner.name)+' · '+fs.winner.frags));var ff=ffaGames.filter(function(g){return g.fpm!=null;}).sort(function(a,b){return b.fpm-a.fpm;})[0];if(ff)ffaRows.push(row('Highest FFA FPM',esc(String(ff.map).toUpperCase())+' · '+longDate(ff.date)+' · '+ff.fpm.toFixed(2)));var lf=ffaGames.slice().sort(function(a,b){return b.players-a.players;})[0];if(lf)ffaRows.push(row('Largest FFA',esc(String(lf.map).toUpperCase())+' · '+longDate(lf.date)+' · '+lf.players+' players'));r=maxEntry(ffaMaps,function(x){return x;});if(r)ffaRows.push(row('Most Played FFA Map',esc(String(r[0]).toUpperCase())+' · '+r[1]));
  r=maxEntry(teams,function(x){return x.wins;});if(r)teamRows.push(row('Most Team Wins',esc(r[0])+' · '+r[1].wins));var tv=teamGames.filter(function(g){return g.margin>0;}).sort(function(a,b){return b.margin-a.margin;})[0];if(tv){var tw=tv.sa>tv.sb?tv.a:tv.b;teamRows.push(row('Largest Team Victory',esc(tw.name)+' · +'+tv.margin));}var ts=teamGames.flatMap(function(g){return[{name:g.a.name,score:g.sa},{name:g.b.name,score:g.sb}];}).sort(function(a,b){return b.score-a.score;})[0];if(ts)teamRows.push(row('Highest Team Score',esc(ts.name)+' · '+ts.score));teamIndividuals.sort(function(a,b){return b.frags-a.frags;});if(teamIndividuals[0])teamRows.push(row('Highest Individual Teamplay Score',esc(teamIndividuals[0].name)+' · '+teamIndividuals[0].frags));r=maxEntry(teamFormats,function(x){return x;});if(r)teamRows.push(row('Most Played Team Format',esc(r[0])+' · '+r[1]));r=maxEntry(teamMatchups,function(x){return x;});if(r)teamRows.push(row('Most Played Team Matchup',esc(r[0])+' · '+r[1]));r=maxEntry(teamMaps,function(x){return x;});if(r)teamRows.push(row('Most Played Team Map',esc(String(r[0]).toUpperCase())+' · '+r[1]));
  r=maxEntry(botPlayers,function(x){return x.wins;});if(r)botRows.push(row('Most VS Bot Wins',esc(r[0])+' · '+r[1].wins));var bv=botGames.filter(function(g){return g.margin>0;}).sort(function(a,b){return b.margin-a.margin;})[0];if(bv)botRows.push(row('Largest VS Bot Victory',esc(bv.human.name)+' · +'+bv.margin));var bs=botGames.slice().sort(function(a,b){return b.human.frags-a.human.frags;})[0];if(bs)botRows.push(row('Highest VS Bot Score',esc(bs.human.name)+' · '+bs.human.frags));r=maxEntry(botMaps,function(x){return x;});if(r)botRows.push(row('Most Played VS Bot Map',esc(String(r[0]).toUpperCase())+' · '+r[1]));
  return section('DUEL',duelRows)+section('FFA',ffaRows)+section('TEAMPLAY',teamRows)+section('VS BOTS',botRows);
}var stats={overview:overview,players:playersStats,maps:mapsStats,duels:function(){return modeStats('duel')},clanwars:function(){return modeStats('clanwar')},ffa:function(){return modeStats('ffa')},bots:function(){return modeStats('bots')},history:history,records:records};
function renderStats(name){name=name||'overview';document.querySelectorAll('[data-stat]').forEach(function(b){b.classList.toggle('active',b.dataset.stat===name)});statsContent.innerHTML=stats[name]();statsContent.classList.toggle('stats-center-table',name==='players'||name==='maps'||name==='history')}
document.querySelectorAll('[data-mode]').forEach(function(b){b.onclick=function(){renderArchive(b.dataset.mode)}});document.querySelectorAll('[data-stat]').forEach(function(b){b.onclick=function(){renderStats(b.dataset.stat)}});document.querySelectorAll('[data-view]').forEach(function(b){b.onclick=function(){document.querySelectorAll('[data-view]').forEach(function(x){x.classList.toggle('active',x===b)});document.getElementById('archivePanel').hidden=b.dataset.view!=='archive';document.getElementById('statsPanel').hidden=b.dataset.view!=='stats';if(b.dataset.view==='stats')renderStats('overview')}});renderArchive('all')})();
</script>
