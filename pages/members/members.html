<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>[QUAD] Members</title><style>@font-face{font-family:'DPQuake';src:url('../../fonts/dpquake_-webfont.woff2') format('woff2');font-weight:normal;font-style:normal;font-display:swap;}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#fff;font-family:Arial,sans-serif}button{font:inherit}.view{height:100dvh;position:relative;overflow:hidden;perspective:1100px}.ring{position:absolute;left:50%;top:48%;width:0;height:0;transform-style:preserve-3d}.card{position:absolute;left:50%;top:50%;width:clamp(72px,9vw,126px);aspect-ratio:.7;translate:-50% -50%;border:2px solid #fff;border-radius:10px;padding:0;background:#111;overflow:hidden;cursor:pointer;box-shadow:0 7px 20px #000b;transition:transform .65s cubic-bezier(.2,.72,.2,1),opacity .5s}.card img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}.card span{position:absolute;left:0;right:0;top:50%;bottom:auto;transform:translateY(-50%);padding:0 4px;color:#fff;font-family:'DPQuake',Arial,sans-serif;font-weight:normal;text-align:center;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000;-webkit-text-stroke:2px #000;paint-order:stroke fill}.controls{position:absolute;bottom:8px;left:50%;translate:-50%;display:flex;gap:8px}.profile-open .controls{visibility:hidden!important;pointer-events:none!important}.controls button{border:1px solid #aaa;background:#111c;color:#fff;padding:8px 13px;border-radius:18px}.overlay{position:fixed;inset:0;z-index:100;display:none;perspective:1400px;pointer-events:none}.overlay.on{display:block}.hero{position:fixed;transform-style:preserve-3d;pointer-events:auto}.hero.zoom-motion{transition:width .7s cubic-bezier(.2,.72,.2,1),height .7s cubic-bezier(.2,.72,.2,1),left .7s cubic-bezier(.2,.72,.2,1),top .7s cubic-bezier(.2,.72,.2,1)}.hero-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.35,.05,.15,1)}.face{position:absolute;inset:0;border:2px solid #555;border-radius:16px;overflow:hidden;backface-visibility:hidden}.front{background:#111}.front img{width:100%;height:100%;object-fit:cover}.front span{position:absolute;left:0;right:0;top:50%;bottom:auto;transform:translateY(-50%);padding:0 5px;text-align:center;font-family:'DPQuake',Arial,sans-serif;font-weight:normal;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000;-webkit-text-stroke:2px #000;paint-order:stroke fill}.back{transform:rotateY(180deg);background:center/cover no-repeat}.back:after{content:"";position:absolute;inset:0;background:#0006}.info{position:relative;z-index:1;width:100%;height:100%;padding:clamp(34px,5vw,70px);display:flex;flex-direction:column;justify-content:center;text-align:center;opacity:0;transition:opacity .3s}.info.show{opacity:1}.profile-name{font-family:'DPQuake',Arial,sans-serif;font-size:clamp(30px,4vw,52px);font-weight:normal;position:absolute;top:22px;left:70px;right:70px;margin:0;text-align:center;z-index:3;opacity:0}.overlay.profile-ready .profile-name{opacity:1}.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px 55px;margin-top:28px;text-align:left;font-size:clamp(14px,1.5vw,20px)}.close{position:absolute;right:12px;top:12px;z-index:5;width:44px;height:44px;border:1px solid #ddd;border-radius:50%;background:#111c;color:#fff;font-size:24px;cursor:pointer}.hidden-card{visibility:hidden}.stacking .card{transition:transform .65s cubic-bezier(.2,.72,.2,1),opacity .5s}.view.flip-hide .ring{visibility:hidden!important}.status-active{color:#4cff73}.status-inactive{color:#ff6262}@media(max-width:700px){.profile-open .mobile-nav{visibility:hidden!important;pointer-events:none!important}.facts{grid-template-columns:1fr;gap:5px}.info{padding:83px 20px 20px;justify-content:flex-start;overflow:auto}.hero.zoomed{left:3vw!important;top:4dvh!important;width:94vw!important;height:92dvh!important}}

.mobile-view{display:none;height:100dvh;position:relative;overflow:hidden}.mobile-rail{height:calc(100dvh - 54px);display:flex;align-items:center;transition:transform .42s ease;will-change:transform}.mobile-card{flex:0 0 auto;width:min(62vw,290px);height:max-content;align-self:center;margin:0 5vw;border:2px solid #fff;border-radius:12px;padding:0;background:#111;overflow:hidden;position:relative;color:#fff;box-shadow:0 8px 22px #000b}.mobile-card img{width:100%;height:auto;display:block}.mobile-card span{position:absolute;left:0;right:0;top:50%;bottom:auto;transform:translateY(-50%);padding:0 6px;font-family:'DPQuake',Arial,sans-serif;font-weight:normal;text-align:center;font-size:clamp(22px,7vw,34px);text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000;-webkit-text-stroke:2px #000;paint-order:stroke fill}.mobile-nav{height:48px;display:flex;justify-content:center;align-items:center;gap:18px}.mobile-nav button{border:1px solid #aaa;background:#111c;color:#fff;padding:8px 14px;border-radius:18px}.mobile-view.flip-hide .mobile-rail{visibility:hidden!important}.mobile-rail{transition:transform .42s ease}@media(max-width:700px){.view{display:none}.mobile-view{display:block}.hero{max-width:none}.controls{display:none}}
</style></head><body><main class="view" id="view"><div class="ring" id="ring"></div><div class="controls"><button id="prev">◀</button><button id="pause">STOP</button><button id="next">▶</button></div></main><main class="mobile-view" id="mobileView"><div class="mobile-rail" id="mobileRail"></div><div class="mobile-nav"><button id="mobilePrev">◀</button><span id="mobileCount"></span><button id="mobileNext">▶</button></div></main><div class="overlay" id="overlay"><div class="hero" id="hero"><div class="hero-inner" id="heroInner"><div class="face front"><img id="heroImg"><span id="heroLabel"></span></div><div class="face back" id="heroBack"><button class="close" id="profileClose">×</button><h2 id="profileName" class="profile-name"></h2><div class="info" id="info"><p id="desc"></p><div class="facts" id="facts"></div></div></div></div></div></div><script>
const data={"arkon":{"desc":"Clanleader, webmaster, server administrator, modder, mapper and engine coder. His addiction to the game and his stubbornness made possible projects and clan facts that seemed impossible in the first place. His killer instict did the rest.","real":"Filippo","aff":"[MiA]","aka":"Feyd Rautha, The Godfather","weapon":"grenade launcher","birth":"June, 14th 1971","map":"E1M2","home":"Torino, Italy","status":"active","since":"February 2000"},"benny":{"desc":"Don't understimate Benny. He does a lot of noise, he chats a lot and will comment every frag of the match. At the end of the game you will find youself owned, with no other words to say rather than good game.","real":"Andrea","aff":"[COBRA]","aka":"classified","weapon":"rocket launcher","birth":"October, 13th 1986","map":"DM6","home":"Torino, Italy","status":"inactive","since":"June 2015"},"bent":{"desc":"The White Jedi has grown fast, so fast that speed become his obsession. Bent is the man behind the demos included in nQuake package, showing to the world what bunny-hopping and trick-jumping means.","real":"Gabor Hugli","aff":"[WING]","aka":"MAX, ED","weapon":"rocket launcher","birth":"May, 4th 1987","map":"DM6","home":"Eger, Hungary","status":"inactive","since":"February 2003"},"biagio":{"desc":"Every strategy has its weaknesses and Biagio knows them all. In the exact moment you understand his tactics, he changes them, in both unexpected and deadly ways. It doesn't matter if you attack or defend, if he's after you, you're dead meat.","real":"Gabriele","aff":"[M.P]","aka":"classified","weapon":"rocket launcher","birth":"May, 31st 1973","map":"E1M5","home":"Ravenna, Italy","status":"inactive","since":"October 2000"},"death":{"desc":"He faced the first days of Quake in Italy, claiming his nickname amongst countless opponents. When he left he said he would be back and each one of us knows it will happen. For the last time.","real":"Alferio","aff":"[COBRA]","aka":"classified","weapon":"lightning gun","birth":"July, 13th 1967","map":"DM3","home":"Cava De' Tirreni, Italy","status":"inactive","since":"June 2015"},"guren":{"desc":"Great fan of LAN parties, Guren is the net technician in chief of the QUake Army of Darkness. He has been there, messing around with cables and hubs, since the second LAN party held in 2001 and is responsible for the clan return in action in 2012.","real":"Marco","aff":"[M.P]","aka":"classified","weapon":"rocket launcher","birth":"July, 14th 1974","map":"E1M5","home":"ShenZhen, China","status":"inactive","since":"October 2012"},"hiroshi":{"desc":"One of the most talented Netquake player ever . Fast and lethal, he knows perfectly where you are in most maps while duelling and he leads [QUAD] attack while playing in team, causing an extreme amount of damage.","real":"Alessandro","aff":"none","aka":"[QUAD] H, ATTLA","weapon":"rocket launcher","birth":"September, 29th 1976","map":"DM6","home":"Las Chafiras, Tenerife, Spain","status":"active","since":"March 2000"},"morpheus":{"desc":"[QUAD] Kid moved backwards from Quake III: Arena (now Quake Live) to Netquake showing great moves and aim. Unbelievably skilled in FFA, he learned whatever oldskool players had to teach and mixed that all with latest techniques to become an even better quaker.","real":"Manuele","aff":"[M.P]","aka":"BQACUQA, Siero][WELCH","weapon":"rocket launcher","birth":"July, 19th 1989","map":"DM6","home":"Lavezzola, Italy","status":"inactive","since":"November 2002"},"plop":{"desc":"You need to be a good player to evade his traps. You need to be an outstanding one to stand a chance. In few words: he's one of the best Netquake deathmatch player ever and who fought him knows this very well.","real":"Carlo","aff":"[ISDN-K], [TOG]","aka":"Dude","weapon":"lightning gun","birth":"January, 30th 1977","map":"DM4","home":"Hasselt, Belgium","status":"inactive","since":"June 2008"},"polarite":{"desc":"Most players consider him the best Netquake player ever. The others simply fear him while in game. Both have lost before. Both will lose in future. Duel, teamplay or FFA makes no difference: give him a weapon and a map, and sooner or later the map belongs to him.","real":"Francis","aff":"[LOD], [ISDN-K], [TOG], [XJ]","aka":"Beast","weapon":"rocket launcher","birth":"August, 21st 1975","map":"DM2","home":"Kortrijk, Belgium","status":"inactive","since":"December 2002"},"qqquaglia":{"desc":"One of the few italian woman whose name remains in Quake ranks. She played lots of LAN matches and her few appearances on internet servers showed at full her FFA skills.","real":"Natascia","aff":"none","aka":"classified","weapon":"axe","birth":"November, 9th 1977","map":"E1M7","home":"Torino, Italy","status":"inactive","since":"March 2000"},"raistlin":{"desc":"No other player has all-around skills like Raistlin. He analyzes his clan mates as well as his opponents and fits the weaknesses of the firsts while breaking through the second ones'. Founder member of the clan, had [QUAD] project in mind even before leaving [MiA]s.","real":"Francesco","aff":"[MiA]","aka":"classified","weapon":"normal shotgun","birth":"May, 4th 1972","map":"E1M2","home":"Torino, Italy","status":"inactive","since":"February 2000"},"redfield":{"desc":"When italian Quake community started to move to Quakeworld he created the Quakehero website, dedicated to the ones who still wants to play Netquake. Good player, he gives his best in FFA.","real":"Fabio","aff":"[MiA]","aka":"classified","weapon":"super shotgun","birth":"November, 26th 1973","map":"E1M1","home":"Roma, Italy","status":"inactive","since":"August 2014"},"ronin":{"desc":"The daemonic samurai is a really die-hard player: you shoot, he jumps somewhere safer. Specialized in silent attacks, he prefers duels and team matches rather than chaotic FFA massacres.","real":"Dario","aff":"[BSB]","aka":"classified","weapon":"rocket launcher","birth":"March, 23th 1980","map":"DM6","home":"Napoli, Italy","status":"inactive","since":"March 2000"},"wham":{"desc":"You don't know shooting prediction, Wham! does. He is one of the few players who raises his ping in LAN games to compare the one he has while playing online. The results are devastating and always spectacular.","real":"Federico","aff":"[MiA]","aka":"classified","weapon":"rocket laucher","birth":"October, 1st 1977","map":"E1M2","home":"Torino, Italy","status":"inactive","since":"April 2001"},"xeno":{"desc":"Mapper, modder and skilled all-around player who prefers the devastation of FFA games above all. He always hides his warcry in his creations: BEST WAY TO HELL. Are you good enough to find them all?","real":"Alessandro","aff":"[COBRA]","aka":"classified","weapon":"rocket launcher","birth":"May, 18th 1961","map":"ZTNDM3","home":"Cava De' Tirreni, Italy","status":"inactive","since":"June 2015"},"yanosh":{"desc":"Server administrator, net technician, so quiet that is quite impossible to find him in duels and of great support in teamplay. Don't dare challenge him in rocket arena mode, never.","real":"Antonio","aff":"none","aka":"Santa Claws, Yorokonde","weapon":"rocket launcher","birth":"February, 1st 1969","map":"UltraV","home":"Maranello, Italy","status":"active","since":"August 2001"},"zizu":{"desc":"When Zizu takes an area, he claims that as his own and there is no way to take it back. This, and his absolutely unique rocket-jumping technique, made of him the perfect defender. His contribution made the difference several times.","real":"Davide","aff":"[M.P]","aka":"[QUAD] KAMPER","weapon":"rocket launcher","birth":"May, 18th 1970","map":"E1M5","home":"Ravenna, Italy","status":"inactive","since":"September 2000"}};
const names=Object.keys(data),ext={arkon:'png',bent:'jpeg',raistlin:'jpeg'},ring=document.querySelector('#ring'),cards=[];let angle=0,paused=false,active=-1,phase='carousel';
const profileName=document.getElementById('profileName');const sleep=ms=>new Promise(r=>setTimeout(r,ms));function renderProfile(n,d){profileName.textContent=label(n);desc.textContent=d.desc;const rows=[['Real Name',d.real],['Older affiliances',d.aff],['Other akas',d.aka],['Birthdate',d.birth],['Hometown',d.home],['Member since',d.since],['Favourite weapon',d.weapon],['Favourite map',d.map],['Status',d.status]];facts.innerHTML=rows.map(([k,v])=>'<div><b>'+k+':</b> <span class="'+(k==='Status'?'status-'+d.status:'')+'">'+v+'</span></div>').join('');}function img(n){return n+'.'+(ext[n]||'jpg')}function label(n){return '[QUAD] '+(n==='ronin'?'RONIN666':n==='wham'?'WHAM!':n.toUpperCase())}
names.forEach((n,i)=>{const b=document.createElement('button');b.className='card';b.innerHTML='<img src="'+img(n)+'"><span>'+label(n)+'</span>';b.onclick=()=>open(i);ring.appendChild(b);cards.push(b)});
const mobileRail=document.getElementById('mobileRail'),mobileCards=[];let mobileIndex=0,mobilePosition=1;
function createMobileCard(n,i){const b=document.createElement('button');b.className='mobile-card';b.innerHTML='<img src="'+img(n)+'"><span>'+label(n)+'</span>';b.onclick=()=>openMobile(i);return b;}
mobileRail.appendChild(createMobileCard(names[names.length-1],names.length-1));
names.forEach((n,i)=>{const b=createMobileCard(n,i);mobileRail.appendChild(b);mobileCards.push(b)});
mobileRail.appendChild(createMobileCard(names[0],0));
function mobileMetrics(){const c=mobileCards[0],st=getComputedStyle(c);return {step:c.getBoundingClientRect().width+parseFloat(st.marginLeft)+parseFloat(st.marginRight),offset:(innerWidth-c.getBoundingClientRect().width)/2-parseFloat(st.marginLeft)};}
function mobileLayout(animate=true){const c=mobileCards[0];if(!c)return;const m=mobileMetrics();mobileRail.style.transition=animate?'transform .42s ease':'none';mobileRail.style.transform='translateX('+(m.offset-mobilePosition*m.step)+'px)';mobileCount.textContent=(mobileIndex+1)+' / '+names.length;}
function mobileMove(dir){if(phase!=='carousel')return;mobilePosition+=dir;mobileIndex=(mobileIndex+dir+names.length)%names.length;mobileLayout(true);setTimeout(()=>{if(mobilePosition===0){mobilePosition=names.length;mobileLayout(false)}else if(mobilePosition===names.length+1){mobilePosition=1;mobileLayout(false)}},430);}
mobilePrev.onclick=()=>mobileMove(-1);mobileNext.onclick=()=>mobileMove(1);
function layout(){const rx=Math.min(innerWidth*.39,560),ry=Math.min(innerHeight*.19,165);cards.forEach((c,i)=>{const a=i/names.length*Math.PI*2+angle,z=Math.cos(a),x=Math.sin(a)*rx,y=-z*ry,sc=.58+(z+1)*.25;c.style.transform='translate3d('+x+'px,'+y+'px,'+(z*320)+'px) scale('+sc+')';c.style.zIndex=Math.round((z+1)*100);c.style.opacity=.48+(z+1)*.26})}
async function gather(i){phase='gather';paused=true;active=i;ring.classList.add('stacking');cards.forEach((c,j)=>{c.style.transform='translate3d(0,0,'+(j===i?20:0)+'px) scale(1)';c.style.opacity=j===i?'1':'.22';c.style.zIndex=j===i?'50':String(j)});await sleep(680)}
async function open(i){if(phase!=='carousel')return;document.body.classList.add('profile-open');await gather(i);const n=names[i],d=data[n],source=cards[i],r=source.getBoundingClientRect();view.classList.add('flip-hide');hero.classList.remove('zoom-motion');overlay.classList.add('on');hero.style.left=r.left+'px';hero.style.top=r.top+'px';hero.style.width=r.width+'px';hero.style.height=r.height+'px';heroImg.src=img(n);heroLabel.textContent=label(n);heroBack.style.backgroundImage='url("'+d.map.toLowerCase()+'.jpg")';renderProfile(n,d);heroInner.style.transform='rotateY(0deg)';await sleep(30);phase='flip';heroInner.style.transform='rotateY(180deg)';await sleep(720);phase='zoom';hero.classList.add('zoom-motion');hero.getBoundingClientRect();hero.style.left='5vw';hero.style.top='5dvh';hero.style.width='90vw';hero.style.height='90dvh';await sleep(720);info.classList.add('show');overlay.classList.add('profile-ready');phase='profile'}
async function openMobile(i){if(phase!=='carousel')return;document.body.classList.add('profile-open');phase='gather';paused=true;active=i;mobileIndex=i;mobilePosition=i+1;mobileLayout();await sleep(430);const n=names[i],d=data[n],source=mobileCards[i],r=source.getBoundingClientRect();mobileView.classList.add('flip-hide');hero.classList.remove('zoom-motion');overlay.classList.add('on');hero.style.left=r.left+'px';hero.style.top=r.top+'px';hero.style.width=r.width+'px';hero.style.height=r.height+'px';heroImg.src=img(n);heroLabel.textContent=label(n);heroBack.style.backgroundImage='url("'+d.map.toLowerCase()+'.jpg")';renderProfile(n,d);heroInner.style.transform='rotateY(0deg)';await sleep(30);phase='flip';heroInner.style.transform='rotateY(180deg)';await sleep(720);phase='zoom';hero.classList.add('zoom-motion');hero.getBoundingClientRect();hero.style.left='3vw';hero.style.top='4dvh';hero.style.width='94vw';hero.style.height='92dvh';await sleep(720);info.classList.add('show');overlay.classList.add('profile-ready');phase='profile'}
async function closeProfile(){if(phase!=='profile')return;const mobile=innerWidth<=700;phase='shrink';info.classList.remove('show');overlay.classList.remove('profile-ready');hero.classList.add('zoom-motion');const r=(mobile?mobileCards[active]:cards[active]).getBoundingClientRect();hero.style.left=r.left+'px';hero.style.top=r.top+'px';hero.style.width=r.width+'px';hero.style.height=r.height+'px';await sleep(720);phase='unflip';heroInner.style.transform='rotateY(0deg)';await sleep(720);overlay.classList.remove('on');hero.classList.remove('zoom-motion');if(mobile){mobileView.classList.remove('flip-hide');active=-1;phase='carousel';paused=false;document.body.classList.remove('profile-open');mobileLayout();return;}view.classList.remove('flip-hide');phase='spread';cards.forEach(c=>{c.style.opacity=''});layout();await sleep(680);ring.classList.remove('stacking');active=-1;phase='carousel';paused=false;document.body.classList.remove('profile-open')}
document.getElementById('profileClose').addEventListener('click',function(e){e.preventDefault();e.stopPropagation();closeProfile();});let spinDir=1;prev.onclick=()=>{if(phase!=='carousel')return;paused=false;spinDir=1;pause.textContent='STOP'};next.onclick=()=>{if(phase!=='carousel')return;paused=false;spinDir=-1;pause.textContent='STOP'};pause.onclick=()=>{paused=!paused;pause.textContent=paused?'START':'STOP'};addEventListener('keydown',e=>{if(e.key==='Escape')closeProfile()});addEventListener('resize',()=>{layout();mobileLayout()});let last=0;function tick(t){if(!paused&&phase==='carousel'){if(last)angle+=spinDir*(t-last)*.00012;layout()}last=t;requestAnimationFrame(tick)}layout();mobileLayout();requestAnimationFrame(tick);
</script></body></html>
