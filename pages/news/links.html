<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>[QUAD] Links</title>
  <link rel="stylesheet" href="../css/quad.css">
  <style>
    .links-box {
      width: 600px;
      max-width: calc(100% - 16px);
      margin: 0 auto;
      padding: 22px 20px;
      box-sizing: border-box;
    }

    .links-header {
      margin: 0 0 18px;
      text-align: center;
    }

    .links-header img {
      display: block;
      width: 64px;
      height: 64px;
      margin: 0 auto;
      border: 0;
    }

    .links-title {
      margin: 10px 0 12px;
      text-align: center;
      color: #fff;
    }

    .links-layout {
      display: grid;
      grid-template-columns: 210px minmax(0, 1fr);
      gap: 22px;
      align-items: stretch;
    }

    .links-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .links-list li {
      margin: 0 0 8px;
    }

    .links-list li:last-child {
      margin-bottom: 0;
    }

    .links-list a {
      display: inline-block;
    }

    .links-details {
      min-height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 16px 20px;
      text-align: center;
    }

    .links-details strong {
      color: #fff;
    }

    .links-details p {
      margin: 0;
      opacity: 1;
      transition: opacity .5s ease;
    }

    .links-details p.is-fading {
      opacity: 0;
    }

    @media (max-width: 560px) {
      .links-box {
        padding: 16px 12px;
      }

      .links-layout {
        grid-template-columns: 1fr;
      }

      .links-list {
        text-align: center;
      }

      .links-details {
        min-height: 130px;
      }
    }
  </style>
</head>
<body class="content-page">
  <div class="page-fade">
    <main class="quad-content">
      <section class="content-box links-box">
        <header class="links-header">
          <img src="../images/news/links/links.png" alt="" aria-hidden="true" width="64" height="64">
          <h3 class="links-title">Links</h3>
        </header>

        <div class="links-layout">
          <ul class="links-list" id="linksList">
            <li><a href="https://quakeone.com/" target="_blank" rel="noopener" data-title="QuakeOne.com" data-description="The largest Quake 1 community on the web featuring Quake file downloads, server listings, help guides and tutorials and a friendly message board!">QuakeOne</a></li>
            <li><a href="https://www.quaddicted.com/" target="_blank" rel="noopener" data-title="Quaddicted" data-description="Quake fan-site offering a complete-as-can-be singleplayer map archive and an accompanying installer/launcher tool, several rather messy archives (engines, tools, wads, multiplayer maps, websites) and a variety of articles, knowledge and help.">Quaddicted</a></li>
            <li><a href="https://www.celephais.net/board/forum.php" target="_blank" rel="noopener" data-title="Func_Msgboard" data-description="A community of hobbyist and professional level designers who share insights, opinions, rants, and flames about Doom 3, Half-Life 2, Quake, Quake 2, Quake III Arena, Cube, and more.">Func_Msgboard</a></li>
            <li><a href="https://www.insideqc.com/" target="_blank" rel="noopener" data-title="Inside QC" data-description="Website focusing on developer discussion for 3D rendering engines for games with a strong emphasis on Quake.">Inside QC</a></li>
            <li><a href="https://quaketerminus.com/" target="_blank" rel="noopener" data-title="Quake Terminus" data-description="A great site created by Megazoid: here you can find news, hints and tips for both single and multiplayer and a large Netquake files archive!">Quake Terminus</a></li>
            <li><a href="https://speeddemosarchive.com/quake/" target="_blank" rel="noopener" data-title="Speed Demos Archive" data-description="A website dedicated to video game speedruns. SDA's primary focus is hosting downloadable, high-quality speedrun videos. It all started with Quake Done Quick.">Speed Demos Archive</a></li>
            <li><a href="https://www.idsoftware.com/" target="_blank" rel="noopener" data-title="id Software" data-description="Official website of id Software, creators of Quake: need to say more?">id Software</a></li>
          </ul>

          <div class="content-box links-details" id="linksDetails" aria-live="polite">
            <p>Details</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    (function () {
      'use strict';

      var details = document.getElementById('linksDetails');
      var links = document.querySelectorAll('#linksList a[data-title]');

      var fadeTimer = null;

      function setDetails(titleText, descriptionText) {
        var current = details.querySelector('p');
        if (!current) return;

        clearTimeout(fadeTimer);
        current.classList.add('is-fading');

        fadeTimer = window.setTimeout(function () {
          var p = document.createElement('p');

          if (titleText) {
            var title = document.createElement('strong');
            title.textContent = titleText;
            p.appendChild(title);
            p.appendChild(document.createElement('br'));
            p.appendChild(document.createTextNode(descriptionText));
          } else {
            p.textContent = 'Details';
          }

          p.classList.add('is-fading');
          details.replaceChildren(p);

          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              p.classList.remove('is-fading');
            });
          });
        }, 500);
      }

      function showDetails(link) {
        setDetails(link.dataset.title, link.dataset.description);
      }

      function resetDetails() {
        setDetails('', '');
      }

      links.forEach(function (link) {
        link.addEventListener('mouseenter', function () {
          showDetails(link);
        });

        link.addEventListener('mouseleave', resetDetails);

        link.addEventListener('focus', function () {
          showDetails(link);
        });

        link.addEventListener('blur', resetDetails);
      });
    })();
  </script>
</body>
</html>
