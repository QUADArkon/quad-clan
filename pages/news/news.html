<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="author" content="Arkon">
<title>[QUAD] News</title>
<link rel="stylesheet" href="../../css/quad.css">
<style>
#randomPictureBox{cursor:pointer}#randomPictureThumb{width:128px;height:96px;object-fit:contain;display:block;flex:0 0 128px;cursor:pointer}#randomPictureInfo{text-align:center}
</style>
</head>
<body class="content-page">
<main id="newsPage" class="quad-content news-page page-fade">
  <div class="news-tools">
    <section id="randomPictureBox" class="content-box random-picture-box" role="link" tabindex="0" aria-label="Open Random Picture">
      <div class="box-label">Random Picture:</div>
      <div class="random-picture-body">
        <img id="randomPictureThumb" class="random-picture-thumb" src="" alt="">
        <div id="randomPictureInfo" class="random-picture-info"></div>
      </div>
    </section>
    <section class="content-box latest-files-box">
      <div class="box-label">Latest Files:</div>
      <div class="latest-files-body"><div class="file-links">
        <a href="../../files/maps/fij2.zip" target="main">12/17/12 Fij2 by Xeno</a>
        <a href="../../files/maps/deceit.zip" target="main">05/08/10 Deceit by Xeno</a>
        <a href="../../files/maps/domus.zip" target="main">01/05/10 Domus by Xeno</a>
        <a href="../../files/maps/fij1.zip" target="main">12/21/09 Fij1 by Xeno</a>
        <a href="../../files/maps/mk.zip" target="main">11/06/09 Mk by Xeno</a>
      </div></div>
    </section>
  </div>
  <div id="newsMainView"></div>
  <div id="randomViewer" class="content-box" hidden>
    <img id="randomViewerImage" src="" alt="" style="display:block;max-width:100%;height:auto;margin:0 auto">
    <div id="randomViewerInfo" class="random-picture-info" style="text-align:center;margin-top:10px"></div>
    <div style="text-align:center;margin-top:12px"><a id="randomBack" href="#">BACK TO NEWS</a></div>
  </div>
</main>
<script src="../../js/trophies.js"></script>
<script src="../../js/lans.js"></script>
<script src="../../js/news-data.js"></script>
<script src="../../js/news.js"></script>
</body>
</html>
