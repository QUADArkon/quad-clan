  <title>[QUAD] Online Name Maker</title>

  <style>
    .name-box{width:600px;max-width:calc(100% - 16px);margin:0 auto;padding:22px 20px;box-sizing:border-box;text-align:center}

    .name-skull{display:block;max-width:100%;height:auto;margin:0 auto 14px}
    .character-table{position:relative;width:256px;height:256px;margin:0 auto 18px}
    .character-sheet{display:block;width:256px;height:256px;border:0}
    .character-grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(16,16px);grid-template-rows:repeat(16,16px)}
    .character-button{appearance:none;display:block;width:16px;height:16px;margin:0;padding:0;border:0;background:transparent;cursor:pointer}
    .character-button:disabled{cursor:default}
    .character-button:not(:disabled):hover,.character-button:not(:disabled):focus-visible{outline:1px solid #ff0;outline-offset:-1px;z-index:2}
    .name-controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px 0 18px}
    .name-controls button{padding:4px 10px;font:inherit}
    .name-preview-label,.name-output-label{display:block;margin:10px 0 6px;font-weight:bold}
    .name-preview{display:grid;grid-template-columns:repeat(15,16px);justify-content:center;width:240px;height:16px;margin:0 auto 14px}

    var entries=[];
    var grid=document.getElementById('characterGrid');
    var preview=document.getElementById('namePreview');
    var output=document.getElementById('nameOutput');
    var status=document.getElementById('nameStatus');

    function spritePosition(code){
      var column=code%16;
      var row=Math.floor(code/16);
      return (-column*16)+'px '+(-row*16)+'px';
    }
    function setPreviewSlot(slot,code){
      slot.style.backgroundPosition=spritePosition(code);
      slot.title=code===32?'':'Character '+String(code).padStart(3,'0');
    }
    function updateCounter(){
      var count=entries.length;
      status.classList.remove('counter-green','counter-yellow','counter-red');
      if(count<=10)status.classList.add('counter-green');
      else if(count<=14)status.classList.add('counter-yellow');
      else status.classList.add('counter-red');
      status.textContent=count+' / '+MAX_LENGTH;
    }
    function render(){
      var slots=preview.children;
      for(var i=0;i<MAX_LENGTH;i+=1){
        setPreviewSlot(slots[i],entries[i]?entries[i].code:32);
      }
      output.value=entries.map(function(entry){return DISPLAY_MAP[entry.code];}).join('');
      output.dataset.copyText=entries.map(function(entry){return COPY_MAP[entry.code];}).join('');
      updateCounter();
    }
    function addCharacter(code){
      if(!SELECTABLE.has(code)||entries.length>=MAX_LENGTH)return;
      entries.push({code:code});
      render();
    }
    function createGrid(){
      for(var code=0;code<=255;code+=1){
        var button=document.createElement('button');
        button.type='button';
        button.className='character-button';
        button.dataset.code=String(code);
        button.disabled=!SELECTABLE.has(code);
        button.setAttribute('aria-label',button.disabled?'Character '+String(code).padStart(3,'0')+' unavailable':'Character '+String(code).padStart(3,'0'));
        if(!button.disabled)button.addEventListener('click',function(){addCharacter(Number(this.dataset.code));});
        grid.appendChild(button);
      }
    }
    function createPreview(){
      for(var i=0;i<MAX_LENGTH;i+=1){
        var slot=document.createElement('span');
        slot.className='preview-character';
        preview.appendChild(slot);
      }
    }
    document.getElementById('addSpace').addEventListener('click',function(){
      if(entries.length>=MAX_LENGTH)return;
      entries.push({code:32});
      render();
    });
    document.getElementById('backspace').addEventListener('click',function(){if(entries.length)entries.pop();render();});
    document.getElementById('resetName').addEventListener('click',function(){entries=[];render();});
    function legacyCopy(text){
      var visual=output.value;
      output.removeAttribute('readonly');
      output.value=text;
      output.focus();
      output.select();
      output.setSelectionRange(0,text.length);
      var ok=false;
      try{ok=document.execCommand('copy');}catch(error){ok=false;}
      output.value=visual;
      output.setAttribute('readonly','');
      return ok;
    }
    output.addEventListener('copy',function(event){
      var text=output.dataset.copyText||'';
      if(!text)return;
      if(event.clipboardData){
        event.preventDefault();
        event.clipboardData.setData('text/plain',text);
      }
    });

    document.getElementById('copyString').addEventListener('click',function(){
      var text=output.dataset.copyText||'';
      if(!text){status.textContent='Nothing to copy';return;}
      if(legacyCopy(text)){status.textContent='Copied';return;}
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){status.textContent='Copied';})
          .catch(function(){status.textContent='Copy failed';});
      }else{status.textContent='Copy failed';}
    });
    createGrid();
    createPreview();
    render();
  }());
