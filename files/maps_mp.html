<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>[QUAD] Maps</title>
  <link rel="stylesheet" href="../css/quad.css">
  <style>
    .files-box{width:600px;max-width:calc(100% - 16px);margin:0 auto;padding:22px 20px;box-sizing:border-box}
    .files-header{text-align:center;margin:0 0 18px}
    .files-header img{display:block;width:65px;height:65px;object-fit:contain;margin:0 auto;border:0}
    .files-title{margin:10px 0 12px;text-align:center;color:#fff}
    .files-list{margin-top:18px}
    .files-empty{margin:0;text-align:center}
    .file-entry{margin:0 0 14px;padding:14px}
    .file-entry:last-child{margin-bottom:0}
    .file-title{margin:0 0 8px;color:#fff}
    .file-description{margin:0 0 8px}
    .file-meta{margin:0 0 8px;font-size:.9em}
    .file-download{display:inline-block}
    @media(max-width:640px){.files-box{padding:16px 12px}}
  </style>
</head>
<body class="content-page">
  <div class="page-fade">
    <main class="quad-content">
      <section class="content-box files-box">
        <header class="files-header">
          <img src="../images/files/maps_mp.png" alt="" aria-hidden="true" width="65" height="65">
          <h3 class="files-title">Multiplayer Maps</h3>
        </header>
        <div class="files-list" id="filesList" data-category="maps_mp"></div>
      </section>
    </main>
  </div>
  <script src="../js/files-data.js"></script>
  <script src="../js/files.js"></script>
</body>
</html>
