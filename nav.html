<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>[QUAD] Menu</title>
  <base target="main">
  <link rel="stylesheet" href="css/quad.css">
</head>
<body class="nav-page">
  <img class="nav-grid" src="images/nav/navret.png" alt="" aria-hidden="true">
  <img class="quake-logo" src="images/nav/quakelogo.gif" alt="" aria-hidden="true">

  <div class="nav-spacer" aria-hidden="true"></div>
  <nav class="site-nav" aria-label="QUAD navigation">
    <img class="nav-top" src="images/nav/menutop.gif" width="150" height="24" alt="">
    <div class="nav-body">
      <img class="nav-side nav-side-left" src="images/nav/menuleft.gif" width="8" height="265" alt="">
      <div class="nav-menu" id="desktop-menu-host"></div>
      <img class="nav-side nav-side-right" src="images/nav/menuright.gif" width="8" height="265" alt="">
    </div>
    <img class="nav-bottom" src="images/nav/menubottom.gif" width="150" height="24" alt="">
  </nav>

  <script src="js/menu.js"></script>
  <script>
    renderQuadMenu(document.getElementById('desktop-menu-host'), { linkTarget: 'main' });
    document.querySelectorAll('.nav-menu details').forEach((section) => {
      const list = section.querySelector('ul');
      list.style.height = '0px';
      section.querySelector('summary').addEventListener('click', (event) => {
        event.preventDefault();
        const opening = !section.open;
        document.querySelectorAll('.nav-menu details').forEach((other) => {
          if (other !== section && other.open) {
            const otherList = other.querySelector('ul');
            otherList.style.height = otherList.scrollHeight + 'px';
            requestAnimationFrame(() => { otherList.style.height = '0px'; });
            otherList.addEventListener('transitionend', () => { other.open = false; }, { once: true });
          }
        });
        if (opening) {
          section.open = true; list.style.height = '0px';
          requestAnimationFrame(() => { list.style.height = list.scrollHeight + 'px'; });
          list.addEventListener('transitionend', () => { if (section.open) list.style.height = 'auto'; }, { once: true });
        } else {
          list.style.height = list.scrollHeight + 'px';
          requestAnimationFrame(() => { list.style.height = '0px'; });
          list.addEventListener('transitionend', () => { section.open = false; }, { once: true });
        }
      });
    });
  </script>
</body>
</html>
