<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>[QUAD] Menu</title><link rel="stylesheet" href="css/quad.css"></head>
<body class="nav-page">
  <img class="nav-grid" src="images/nav/navret.png" alt="">
  <img class="quake-logo" src="images/nav/quakelogo.gif" alt="[QUAD]">
  <div class="nav-spacer"></div>
  <nav class="site-nav" aria-label="QUAD navigation">
    <img class="nav-top" src="images/nav/menutop.gif" alt="">
    <div class="nav-body">
      <img class="nav-side nav-side-left" src="images/nav/menuleft.gif" alt="">
      <div class="nav-menu" id="desktop-menu-host"></div>
      <img class="nav-side nav-side-right" src="images/nav/menuright.gif" alt="">
    </div>
    <img class="nav-bottom" src="images/nav/menubottom.gif" alt="">
  </nav>
  <script src="js/menu.js"></script>
  <script>
    const desktopMenuHost = document.getElementById('desktop-menu-host');

    renderQuadMenu(desktopMenuHost, { linkTarget: 'main' });
    window.addEventListener('message', event => {
      if (!event.data || event.data.type !== 'quad-admin-show-menu') return;
      if (typeof showQuadAdministration !== 'function') return;
      if (!showQuadAdministration()) return;
      renderQuadMenu(desktopMenuHost, { linkTarget: 'main' });
    });

    desktopMenuHost.addEventListener('click', event => {
      const link = event.target.closest('a');
      if (!link || link.target === '_blank' || link.protocol === 'mailto:') return;

      event.preventDefault();
      parent.postMessage({ type: 'quad-desktop-navigate', href: link.href }, '*');
    });

    const MENU_MS = 260;

    function closeSection(section) {
      const list = section.querySelector('ul');
      if (!list || !section.open) return;
      list.style.height = list.scrollHeight + 'px';
      requestAnimationFrame(() => {
        list.style.height = '0px';
        window.setTimeout(() => { section.open = false; }, MENU_MS);
      });
    }

    function openSection(section) {
      const list = section.querySelector('ul');
      if (!list) return;
      document.querySelectorAll('#desktop-menu-host details').forEach(other => {
        if (other !== section) closeSection(other);
      });
      section.open = true;
      list.style.height = '0px';
      requestAnimationFrame(() => {
        requestAnimationFrame(() => { list.style.height = list.scrollHeight + 'px'; });
      });
    }

    desktopMenuHost.addEventListener('click', event => {
      const summary = event.target.closest('summary');
      if (!summary) return;
      const section = summary.closest('details');
      if (!section) return;
      event.preventDefault();
      if (section.open) closeSection(section); else openSection(section);
    });
  </script>
</body>
</html>
