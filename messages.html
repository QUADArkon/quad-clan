<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>[QUAD] Messages</title><style>
@font-face{font-family:DPQuake;src:url('fonts/dpquake_-webfont.woff2') format('woff2');font-display:swap}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}.bg{position:absolute;inset:0;overflow:hidden}.s{position:absolute;top:-3%;bottom:-3%;left:-12%;width:124%;opacity:0;visibility:hidden;background:center/cover no-repeat;transition:opacity 3s ease,visibility 3s ease}.s.on{opacity:1;visibility:visible;animation:pan 18s linear forwards}.s.top{z-index:2}@keyframes pan{from{transform:translateX(5%) scale(1.025)}to{transform:translateX(-5%) scale(1.075)}}.fx{position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(ellipse,transparent 34%,rgba(0,0,0,.74)),repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px)}.hero{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center}.title{margin:0;font:400 clamp(38px,7vw,96px)/.95 DPQuake,Impact,fantasy;color:#d8c7a3;text-shadow:3px 3px #000,0 0 14px #000}.rule{height:1px;margin:24px auto;width:min(680px,68vw);background:linear-gradient(90deg,transparent,#c8aa75,transparent)}canvas{display:block;max-width:92vw;height:auto;margin:auto;image-rendering:pixelated;filter:drop-shadow(3px 3px #000)}@media(max-width:736px){.s{left:-18%;width:136%}.s.on{animation-duration:14s}.rule{margin:16px auto}}
</style></head><body><div class="bg" id="bg"></div><div class="fx"></div><main class="hero"><div><h1 class="title" id="quad-title">QUake Army of Darkness</h1><div class="rule"></div><canvas id="q"></canvas></div></main><script>
(()=>{const messages=[
'THIS HALL SELECTS EASY SKILL','THIS HALL SELECTS NORMAL SKILL','FEEL THE PAIN','THIS HALL SELECTS HARD SKILL','PRAY FOR YOUR LIFE','YOUR WORST NIGHTMARE COME TRUE ...','GM & AR FOREVER !!!','THIS PASSAGE SELECTS NIGHTMARE SKILL!','THE WELL OF WISHES AWAITS IN THE CRYPT OF DECAY!','THE MYSTICAL PAST COME ALIVE ...','[QUAD] CLAN','ANCIENT CASTLES AND STRANGE BEASTS AHEAD ...','PRIMAL FEAR IN A STRANGE DIMENSION ...','PRESS CTRL - ALT - DEL','FOUR TIMES THE PAIN','59 Armour, -7 Health, 9 Rockets','YOU FOUND A SECRET AREA!','YOU CAN JUMP ACROSS ...','YOU CAN JUMP UP HERE ...','You got the Super Nailgun',"Don't know what you got (Till it's gone)",'SHOOT THIS SECRET DOOR ...','[QUAD] ROCKS','type HELP-SERVER in console for help','Only one team present','IMPRESSIVE !!!','ONLY 2 MORE TO GO ...','ONLY 1 MORE TO GO ...','SEQUENCE COMPLETED!','WALK INTO THE SLIPGATE TO EXIT ...',':)',':(','NICE !!!','YOU ARE VERY LUCKY !!!','YOU GOT THE RUNE!','SHUB-NUGGURAT AWAITS YOU ...','ID SOFTWARE SALUTES YOU ...','QWSUCKS !!!','-zone 1024 -heapsize 64000','BEST WAY TO HELL','TI SOPAKKO!',"Ma comm' 'e puorte 'sti capille?"];
const bg=document.getElementById('bg'),c=document.getElementById('q'),x=c.getContext('2d'),sheet=new Image(),layers=[];let t,currentImage=-1,currentMessage=-1;messages.forEach((m,i)=>{const e=document.createElement('div');e.className='s';e.style.backgroundImage=`url(images/messages/bg${String(i+1).padStart(2,'0')}.jpg)`;bg.append(e);layers.push(e)});function type(s){clearInterval(t);s=s.toUpperCase();c.width=Math.max(16,s.length*16);c.height=16;x.imageSmoothingEnabled=false;x.clearRect(0,0,c.width,c.height);let i=0;t=setInterval(()=>{if(i>=s.length)return clearInterval(t);let code=s.charCodeAt(i);if(code<32||code>126)code=63;code+=i%2?128:0;x.drawImage(sheet,(code&15)*16,(code>>4)*16,16,16,i*16,0,16,16);i++},52)}function pickRandom(max,previous){let value;do{value=Math.floor(Math.random()*max)}while(max>1&&value===previous);return value}function showRandom(){const oldImage=currentImage;currentImage=pickRandom(layers.length,currentImage);currentMessage=pickRandom(messages.length,currentMessage);if(oldImage>=0)layers[oldImage].classList.remove('top');layers[currentImage].classList.add('on','top');type(messages[currentMessage]);if(oldImage>=0)setTimeout(()=>layers[oldImage].classList.remove('on'),3000)}sheet.onload=()=>{showRandom();setInterval(showRandom,11000)};sheet.src='images/messages/conchars.png';})();

<script>
/* jQuery Burn v0.3.2 algorithm, embedded for this title only, without jQuery. */
(() => {
  const title = document.getElementById('quad-title');
  if (!title) return;

  const settings = {
    a: 0.3,
    k: 0.05,
    w: 10,
    wind: 1,
    strength: 1,
    flames: [
      { x: 0, hsla: [58, 96, 89, 1], y: 0,    blur: 0.1  },
      { x: 0, hsla: [51, 98, 76, 1], y: 0.02, blur: 0.15 },
      { x: 0, hsla: [36,100, 60, 1], y: 0.04, blur: 0.2  },
      { x: 0, hsla: [28, 91, 49, 1], y: 0.08, blur: 0.25 },
      { x: 0, hsla: [19, 94, 41, 1], y: 0.15, blur: 0.3  },
      { x: 0, hsla: [15, 75, 34, 1], y: 0.2,  blur: 0.4  },
      { x: 0, hsla: [14, 66, 16, 1], y: 0.5,  blur: 0.5  }
    ]
  };

  function wave(y, time, random) {
    return random * settings.a * Math.sin(settings.k * y - settings.w * time);
  }

  function burn(now) {
    const time = now / 1000;
    const shadows = settings.flames.map(flame => {
      const random = Math.sqrt(Math.random());
      flame.x = wave(flame.y, time, random);
      const x = (flame.x + settings.wind) * flame.y * settings.strength;
      const y = -flame.y * settings.strength;
      const blur = flame.blur * settings.strength;
      const h = flame.hsla;
      return `${x}em ${y}em ${blur}em hsla(${h[0]}, ${h[1]}%, ${h[2]}%, ${h[3]})`;
    });
    title.style.textShadow = shadows.join(', ');
    requestAnimationFrame(burn);
  }

  requestAnimationFrame(burn);
})();
</script>
